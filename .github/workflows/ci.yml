name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      APP_NAME: arunika-coffee-api-master-data-service-test
      APP_HOST: 127.0.0.1
      APP_PORT: 3000
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_NAME: arunika_coffee_master_data_test
      DATABASE_USER: test
      DATABASE_PASSWORD: test
      DATABASE_URL: mysql://test:test@127.0.0.1:3306/arunika_coffee_master_data_test
      GRPC_MASTER_HOST: 127.0.0.1
      GRPC_MASTER_PORT: 50053
      SECURITY_CORS_ORIGINS: http://localhost:3000
      OTEL_SERVICE_NAME: arunika-coffee-api-master-data-service-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -t arunika-coffee-api-master-data-service:ci .
